# Training hyperparameters (Section 5.6). Nothing here should be hard-coded
# in ml/training/train.py — change behavior by editing this file, not the code.

seed: 42

optimizer:
  learning_rate: 0.001
  weight_decay: 0.0

batch_size: 8
epochs: 10

# Per-disorder positive-class weighting for BCEWithLogitsLoss, to compensate
# for class imbalance in the real datasets (e.g. seizure-positive windows
# are rare in CHB-MIT). 1.0 = no reweighting; tune once real label
# distributions are known.
loss_weighting:
  epilepsy: 1.0
  adhd: 1.0
  mci: 1.0

checkpointing:
  checkpoint_dir: ml/checkpoints
  keep_best_only_metric: val_loss

run_log:
  path: ml/checkpoints/run_log.jsonl
  dataset_version: v1
